<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Auto-detect backend API URL or read from localStorage / query / default relative
    window.API_BASE = localStorage.getItem("CAPTION_API_BASE") || window.__CAPTION_API_BASE__ || "";
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">CC</span> Caption Studio</div>
    <div class="project-title" id="projectTitle"></div>
    <div class="top-actions">
      <span class="export-status" id="exportStatus"></span>
      <button class="btn ghost" id="srtBtn" disabled title="Download subtitles as .srt">SRT</button>
      <button class="btn primary" id="exportBtn" disabled>Export video</button>
    </div>
  </header>

  <aside class="sidebar">
    <nav class="tabs">
      <button class="tab active" data-tab="files">Files</button>
      <button class="tab" data-tab="captions">Captions</button>
      <button class="tab" data-tab="style">Style</button>
    </nav>

    <section class="panel active" data-panel="files">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="video/*" hidden />
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 3l5 5h-3v6h-4V8H7l5-5zm-7 14h14v3H5v-3z"/></svg>
        <strong>Drop a video</strong>
        <span>or click to browse</span>
      </label>
      <div class="upload-progress" id="uploadProgress" hidden><div></div></div>
      
      <div class="transcribe-controls" id="transcribeControls" hidden>
        <div class="field" style="margin-top: 12px; margin-bottom: 8px;">
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Language</label>
          <select id="langSelect" style="width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px; color: var(--text); outline: none;">
            <option value="auto">Auto-detect (Default)</option>
            <option value="hinglish">Hinglish (Hindi in Roman script)</option>
            <option value="hi-IN">Hindi (हिंदी)</option>
            <option value="en-IN">English</option>
            <option value="bn-IN">Bengali (বাংলা)</option>
            <option value="ta-IN">Tamil (தமிழ்)</option>
            <option value="te-IN">Telugu (తెలుగు)</option>
            <option value="mr-IN">Marathi (मराठी)</option>
            <option value="gu-IN">Gujarati (ગુજરાતી)</option>
            <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
            <option value="ml-IN">Malayalam (മലയാളം)</option>
            <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
          </select>
        </div>
        <button class="btn primary" id="startTranscribeBtn" style="width: 100%; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          Start Captioning
        </button>
      </div>

      <ul class="file-list" id="fileList"></ul>
    </section>

    <section class="panel" data-panel="captions">
      <div class="empty" id="captionsEmpty">Captions will appear here after transcription.</div>
      <ul class="caption-list" id="captionList"></ul>
    </section>

    <section class="panel" data-panel="style">
      <div class="field">
        <label>Font</label>
        <select id="sFont">
          <option>Nirmala UI</option>
          <option>Segoe UI</option>
          <option>Arial</option>
          <option>Verdana</option>
          <option>Georgia</option>
          <option>Impact</option>
        </select>
      </div>
      <div class="field"><label>Size <output id="oSize"></output></label><input type="range" id="sSize" min="32" max="140" /></div>
      <div class="field"><label>Position from bottom <output id="oPos"></output></label><input type="range" id="sPos" min="3" max="85" /></div>
      <div class="field row"><label>Text colour</label><input type="color" id="sColor" /></div>
      <div class="field row"><label><input type="checkbox" id="sHighlight" /> Highlight active word</label><input type="color" id="sHlColor" /></div>
      <div class="field row"><label><input type="checkbox" id="sUpper" /> UPPERCASE</label></div>
      <div class="field row"><label><input type="checkbox" id="sBg" /> Background box</label><input type="color" id="sBgColor" /></div>
      <div class="field" id="fOutline"><label>Outline <output id="oOutline"></output></label><input type="range" id="sOutline" min="0" max="14" /></div>
      <div class="field" id="fBgOp" hidden><label>Box opacity <output id="oBgOp"></output></label><input type="range" id="sBgOp" min="0" max="100" /></div>
      <button class="btn ghost small" id="resetStyle">Reset style</button>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-empty" id="stageEmpty">
      <p>Drop a video to get started</p>
      <span>Sarvam (saaras:v4) transcribes it and generates timed captions automatically.</span>
    </div>
    <div class="player" id="player" hidden>
      <video id="video" playsinline preload="auto"></video>
      <div class="caption-layer" id="captionLayer"><div class="caption" id="captionBox"></div></div>
      <div class="busy" id="busy" hidden><div class="spinner"></div><p id="busyText"></p></div>
    </div>
  </main>

  <section class="timeline">
    <div class="tl-toolbar">
      <button class="icon-btn" id="playBtn" title="Play / pause (Space)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="timecode"><span id="curTime">00:00.00</span> / <span id="durTime">00:00.00</span></span>
      <div class="tl-sep"></div>
      <button class="btn ghost small" id="addBtn" title="Add caption at playhead (A)">+ Add</button>
      <button class="btn ghost small" id="splitBtn" title="Split at playhead (S)">Split</button>
      <button class="btn ghost small" id="mergeBtn" title="Merge with next (M)">Merge</button>
      <button class="btn ghost small" id="deleteBtn" title="Delete (Del)">Delete</button>
      <button class="btn ghost small" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn ghost small" id="retryBtn" hidden>Re-transcribe</button>
      <div class="tl-spacer"></div>
      <span class="hint">Drag edges to trim · double-click to edit</span>
      <label class="zoom">Zoom <input type="range" id="zoom" min="20" max="400" value="100" /></label>
    </div>
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-content" id="tlContent">
        <div class="ruler" id="ruler"></div>
        <div class="track caption-track" id="captionTrack"></div>
        <canvas class="track wave-track" id="wave"></canvas>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </section>

  <script src="timing.js"></script>
  <script src="app.js"></script>
</body>
</html>
